; OPcache, tuned for a container whose code never changes at runtime.
opcache.enable = 1
opcache.enable_cli = 0

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The image is immutable: nothing rewrites a .php file after build, so there is
; nothing to revalidate. Skipping the stat() per include is most of the win.
opcache.validate_timestamps = 0

; Keep file/line information — without it, a stack trace names no source
; location and a production incident becomes guesswork.
opcache.save_comments = 1
