user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    # A WebSocket upgrade must forward `Connection: upgrade`, but a *keepalive*
    # request must not — sending it on an ordinary request breaks connection
    # reuse. This map picks the right value per request, which is why the
    # WebSocket location can use $connection_upgrade rather than a literal.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # FastCGI expects HTTPS to be set to "on" or absent entirely — an empty
    # string is not the same as unset. Derived from the scheme the proxy saw.
    map $scheme $https_flag {
        default '';
        https   on;
    }

    include /etc/nginx/conf.d/*.conf;
}
