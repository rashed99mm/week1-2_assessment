name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Laravel API
  # ==========================================================================
  php-lint:
    name: PHP · Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickets-backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # composer.lock is committed. `install` respects it; `update` would
      # silently test a different dependency set than anyone runs locally.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

  php-tests:
    name: PHP · PHPUnit (sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickets-backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # bcmath: exact money arithmetic in OrderService.
          # gd: EventCoverSeeder's fallback poster generation.
          extensions: mbstring, bcmath, gd, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('tickets-backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The suite runs against sqlite :memory: (phpunit.xml), but the framework
      # still needs an APP_KEY and a signing key to boot.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force
          # HS256 here: generating an RSA pair per CI run buys nothing, and the
          # claim behaviour under test is algorithm-independent.
          sed -i 's/^JWT_ALGO=.*/JWT_ALGO=HS256/' .env
          sed -i 's|^JWT_PRIVATE_KEY=.*|JWT_PRIVATE_KEY=|' .env
          sed -i 's|^JWT_PUBLIC_KEY=.*|JWT_PUBLIC_KEY=|' .env

      - name: Run tests
        run: php artisan test

      # The Node and .NET consumers hand-write their types from this schema.
      # Nothing in PHP validates against it, so without this step the producer
      # and the contract drift silently, and the first symptom is a consumer
      # dead-lettering messages in a different repository.
      - name: Validate domain events against the published contract
        run: |
          python -m pip install --quiet jsonschema
          php artisan test --filter DomainEventContractTest
          python ../scripts/validate-domain-events.py

  # The sqlite lane above is fast but cannot exercise row locking, unsigned
  # columns, or case-sensitive LIKE. This lane runs the same suites against the
  # engine production actually uses, plus the concurrency group.
  php-tests-postgres:
    name: PHP · PHPUnit (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickets-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tickets_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tickets"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, pgsql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('tickets-backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force
          sed -i 's/^JWT_ALGO=.*/JWT_ALGO=HS256/' .env
          sed -i 's|^JWT_PRIVATE_KEY=.*|JWT_PRIVATE_KEY=|' .env
          sed -i 's|^JWT_PUBLIC_KEY=.*|JWT_PUBLIC_KEY=|' .env

      - name: Run tests
        run: php artisan test -c phpunit.pgsql.xml

  # ==========================================================================
  # Payment gateway
  # ==========================================================================
  python-tests:
    name: Python · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            payment-gateway/requirements.txt
            payment-gateway/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      # Migrations are the schema of record now; a broken one is only
      # discovered at deploy time otherwise.
      - name: Check migrations apply and roll back
        env:
          DATABASE_URL: sqlite:///./ci_check.db
        run: |
          alembic upgrade head
          alembic downgrade base

  # ==========================================================================
  # Notification service
  # ==========================================================================
  node-tests:
    name: Node · Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notification-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The tests render from dist/templates, because MJML compilation is a
      # lossy step and the point is to assert what actually gets sent.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # ==========================================================================
  # Analytics service
  # ==========================================================================
  dotnet-tests:
    name: .NET · xUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('analytics-service/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Warnings are errors here: a nullability warning in a service that
      # parses another system's payloads is a NullReferenceException waiting
      # for the first event with an optional field omitted.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # EphemeralMongo downloads and runs a real mongod, so the aggregation
      # pipelines are executed by the engine production uses — no Docker needed.
      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity minimal

  # ==========================================================================
  # Front-ends
  # ==========================================================================
  frontend-build:
    name: Portal · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # There is no test runner in this app. `tsc -b && vite build` is the gate.
      - name: Typecheck and build
        run: npm run build

  cms-build:
    name: CMS · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-cms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      # The app is served under /admin/; without the right base href it loads
      # and then requests its bundles from the site root, which is the portal.
      - name: Verify base href
        run: grep -q '<base href="/admin/">' dist/admin-cms/browser/index.html

  # ==========================================================================
  # Everything together
  # ==========================================================================
  e2e-smoke:
    name: E2E · compose smoke test
    runs-on: ubuntu-latest
    needs:
      - php-tests
      - php-tests-postgres
      - python-tests
      - node-tests
      - dotnet-tests
      - frontend-build
      - cms-build

    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets
        run: ./scripts/generate-secrets.sh

      # --wait blocks until every healthcheck passes, so a green return means
      # the stack is serving rather than merely started.
      - name: Start the stack
        run: docker compose up -d --wait --quiet-pull

      - name: Run the curl suite
        env:
          API_BASE: http://localhost/api/v1
          # The gateway has no published port by design, so section 5 is
          # reached through the compose network instead.
          GATEWAY_BASE: http://localhost/__no_gateway_route__
        run: bash test-cases.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
