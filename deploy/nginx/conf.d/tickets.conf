# The single public entrypoint.
#
# Everything else in the deployment is on an internal network with no published
# port, so this file is the whole surface an attacker can reach.

upstream tickets_api {
    server api:9000;
}

upstream tickets_notifications {
    server notifications:3000;
}

upstream tickets_analytics {
    server analytics:8080;
}

server {
    listen 80;
    server_name _;

    root /srv/portal;
    index index.html;

    # The cover-image upload is validated at 4096 KB, and PHP is configured to
    # accept 8M. nginx's default of 1M would reject the request before either
    # of them saw it, producing a 413 that looks like an application bug.
    client_max_body_size 12m;

    charset utf-8;

    # The upstreams generate absolute URLs (event cover images, pagination
    # links) and need to know the browser saw https on the original host.
    # Laravel is configured with trustProxies('*') to honour these; without
    # both halves, every cover image is emitted as http:// and blocked as
    # mixed content.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Edge health probe. Answers without touching any upstream, so it reports
    # on the proxy itself rather than on whatever is behind it.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------------------------------------------------------------------
    # Laravel API — both the versioned and the legacy compatibility mount
    # ---------------------------------------------------------------------
    # Every API request goes to Laravel's front controller, so there is no
    # try_files dance and nginx does not need the application code mounted —
    # only the PHP container does.
    location ~ ^/api(/|$) {
        include        fastcgi_params;
        fastcgi_pass   tickets_api;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  SCRIPT_NAME     /index.php;
        fastcgi_param  DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param  HTTPS           $https_flag;
        fastcgi_param  REQUEST_SCHEME  $scheme;

        # Long enough for a checkout that waits on the payment gateway (15s
        # client timeout) plus overhead, short enough that a hung upstream does
        # not hold the connection indefinitely.
        fastcgi_read_timeout 60s;
    }

    # Laravel's own health endpoint, served by the same front controller.
    location = /up {
        include        fastcgi_params;
        fastcgi_pass   tickets_api;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  SCRIPT_NAME     /index.php;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Uploaded event covers
    # ---------------------------------------------------------------------
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # The portal draws covers onto a WebGL canvas. A cross-origin image
        # without CORS headers taints the canvas and makes readback throw.
        add_header Access-Control-Allow-Origin "*";

        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Notification service
    # ---------------------------------------------------------------------
    location /notifications/api/ {
        proxy_pass http://tickets_notifications/api/;
        proxy_http_version 1.1;
    }

    # WebSocket. Three things are required and all three are easy to omit:
    #
    #  - HTTP/1.1, because the upgrade handshake does not exist in 1.0;
    #  - the Upgrade and Connection headers, forwarded verbatim;
    #  - a long read timeout. The default 60s silently closes an idle socket,
    #    the client falls back to long-polling and reconnects forever, and the
    #    only symptom is a dashboard that feels laggy.
    location /notifications/ws {
        proxy_pass http://tickets_notifications;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---------------------------------------------------------------------
    # Analytics service
    # ---------------------------------------------------------------------
    location /analytics/api/ {
        proxy_pass http://tickets_analytics/api/;
        proxy_http_version 1.1;

        # Dashboard aggregations scan a read model; give them room.
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # Angular admin CMS
    # ---------------------------------------------------------------------
    location /admin/ {
        alias /srv/cms/;

        # SPA fallback. Built with --base-href=/admin/ so its asset URLs
        # resolve under this prefix.
        try_files $uri $uri/ /admin/index.html;
    }

    # Hashed filenames, so they can be cached hard.
    location ~ ^/admin/.*\.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
        alias /srv/cms/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------
    # React user portal — last, so every other prefix wins
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached: it names the hashed asset bundles, so a
    # stale copy pins a returning visitor to a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The payment gateway is deliberately absent. It is reachable only from the
    # API container over the internal network and publishes no port.
}
