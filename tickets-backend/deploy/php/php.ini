; Application PHP settings.
;
; The upload limits here are load-bearing rather than cosmetic:
; StoreEventRequest allows a cover image up to 4096 KB, and PHP's stock
; upload_max_filesize of 2M would reject it before validation ever runs. The
; error surfaces as a 413 that looks like an nginx problem.
;
; post_max_size must be the larger of the two — it caps the whole request body,
; of which the file is only part.
upload_max_filesize = 8M
post_max_size = 12M

memory_limit = 256M
max_execution_time = 60

; Never render a stack trace into an HTTP response. Errors go to the container
; log, where they belong.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

date.timezone = UTC
